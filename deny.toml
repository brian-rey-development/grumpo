# Supply chain policy, checked by `cargo deny check` locally and in CI.

[graph]
# Only the crates that can end up in a shipped macOS binary are checked, which excludes the
# Linux and Windows backends that Tauri pulls in on other targets. All features are enabled so
# optional dependencies such as ts-rs are covered too. A future Linux or Windows port must add
# its targets here.
targets = ["aarch64-apple-darwin", "x86_64-apple-darwin"]
all-features = true

[advisories]
# Known vulnerabilities are always errors. Unmaintained crates only fail the
# build when a workspace member depends on them directly, because Tauri pulls
# in transitive crates (for its Linux and Windows backends) that we cannot
# replace.
unmaintained = "workspace"
yanked = "deny"
ignore = []

[licenses]
confidence-threshold = 0.9
allow = [
  "MIT",
  "MIT-0",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "0BSD",
  "CC0-1.0",
  "Unlicense",
  "Unicode-3.0",
  "MPL-2.0",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
