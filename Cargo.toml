[workspace]
resolver = "2"
members = ["crates/focus-core", "crates/grumpod", "app/src-tauri"]

[workspace.package]
version = "0.1.2"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/brian-rey-development/grumpo"
homepage = "https://brian-rey-development.github.io/grumpo/"
authors = ["Brian Rey"]
rust-version = "1.99"
publish = false

[workspace.dependencies]
focus-core = { path = "crates/focus-core" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
libc = "0.2"
tempfile = "3"
ts-rs = { version = "12", features = ["chrono-impl"] }
rusqlite = { version = "0.40", features = ["bundled"] }
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-app-kit = "0.3"
objc2-core-graphics = "0.3"
objc2-io-kit = "0.3"
tauri = "=2.12.3"
tauri-build = "=2.7.2"
tauri-plugin-notification = "=2.6.0"
tauri-plugin-autostart = "=2.7.0"
tauri-plugin-updater = "=2.12.0"
plist = "1"

[workspace.lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"

[profile.release]
lto = true
codegen-units = 1
strip = true
