# After a rotation newsyslog does not create the fresh log (no C flag), so the daemon creates and
# reopens it on its next 15 second tick, and the few seconds of lines logged before that land in
# the rotated file.
# logfilename                     [owner:group]  mode  count  size(KB)  when  flags
/Library/Logs/Focus/focusd.log                   644   5      1024      *     NZ
