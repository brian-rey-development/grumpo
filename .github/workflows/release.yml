name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  release:
    name: release
    runs-on: macos-15
    timeout-minutes: 90
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: app/package.json

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml

      # Tauri reads the app version from the Cargo workspace and the UI reads it from
      # app/package.json, so the tag must match both.
      - name: Check that the tag matches both version sources
        run: |
          npm_version="$(node -p "require('./app/package.json').version")"
          cargo_version="$(sed -n '/^\[workspace.package\]/,/^\[/ s/^version = "\(.*\)"/\1/p' Cargo.toml)"
          for version in "$npm_version" "$cargo_version"; do
            [[ "$GITHUB_REF_NAME" == "v$version" ]] || {
              echo "Tag $GITHUB_REF_NAME does not match app/package.json $npm_version and Cargo.toml $cargo_version" >&2
              exit 1
            }
          done

      - name: Install Rust toolchain with both Mac targets
        run: |
          rustup toolchain install
          rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Build the universal app
        run: scripts/build-release.sh --universal

      - name: Pack Grumpo.dmg
        run: scripts/package-dmg.sh

      # A draft, so a person checks the notes and the download before the site links to it.
      # Publishing the draft triggers the Site workflow, which redeploys the landing page.
      - name: Create a draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --draft \
            --verify-tag \
            --title "Grumpo ${GITHUB_REF_NAME#v}" \
            --generate-notes \
            dist/release/Grumpo.dmg dist/release/Grumpo.dmg.sha256
