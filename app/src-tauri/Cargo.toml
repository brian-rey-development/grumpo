[package]
name = "focus-app"
description = "Grumpo desktop app: screen-time tracking and focus blocking"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
name = "focus_app_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build.workspace = true

[dependencies]
focus-core.workspace = true
base64.workspace = true
chrono.workspace = true
rusqlite.workspace = true
ts-rs = { workspace = true, optional = true }
tauri = { workspace = true, features = ["tray-icon", "macos-private-api", "image-png"] }
tauri-plugin-notification.workspace = true
tauri-plugin-autostart.workspace = true
plist.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tracing-appender.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
objc2.workspace = true
objc2-foundation.workspace = true
objc2-app-kit.workspace = true
objc2-core-graphics.workspace = true
objc2-io-kit.workspace = true
libc.workspace = true
objc2-core-foundation = "0.3"
objc2-application-services = "0.3"
objc2-core-services = "0.3"

[dev-dependencies]
focus-core = { workspace = true, features = ["test-support"] }
tempfile.workspace = true

[features]
ts = ["dep:ts-rs", "focus-core/ts"]

[lints]
workspace = true
